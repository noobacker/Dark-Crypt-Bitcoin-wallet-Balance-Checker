<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark-Crypt Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #00ff88;
            --border: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        /* Glass/Glow effect on the top border */
        .dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .header-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-row h2 {
            margin: 0;
            font-size: 1.2em;
            color: #fff;
        }

        .stats-display {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background: #090c10;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #21262d;
            color: #7ee787;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <h1>Dark-Crypt</h1>
    <div class="subtitle">Live Telemetry Dashboard</div>

    <div class="dashboard">
        <div class="header-row">
            <span class="status-dot"></span>
            <h2>SCANNER ACTIVE</h2>
        </div>
        <div class="stats-display" id="stats-container">
            Initializing connection... Waiting for data stream...
        </div>
    </div>

    <div class="footer">
        Data refreshes automatically every 5 seconds.<br>
        Bypassing CORS via script injection.
    </div>

    <script>
        // Fetch stats without CORS issues by dynamically injecting a JS file
        function fetchStats() {
            var oldScript = document.getElementById('stats-script');
            if (oldScript) {
                oldScript.remove();
            }
            
            var script = document.createElement('script');
            script.id = 'stats-script';
            script.src = 'stats-data.js?t=' + new Date().getTime(); // Prevent caching
            
            script.onload = function() {
                if (window.scannerStats) {
                    document.getElementById('stats-container').innerText = window.scannerStats;
                }
            };
            
            script.onerror = function() {
                // If python hasn't created the file yet
                if (document.getElementById('stats-container').innerText.includes("Initializing")) {
                    document.getElementById('stats-container').innerText = "Waiting for scanner to start generating stats...";
                }
            };
            
            document.body.appendChild(script);
        }

        // Fetch immediately and then every 5 seconds
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
